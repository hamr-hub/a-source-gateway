name: 功能建议
description: 提议新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 不是"想要什么功能",而是"现在什么做不到"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
