name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号(例如 v1.0.0)'
        required: true
        type: string

# 默认只读;每个 job 单独提权
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # 同一个 tag 不并发发布;也不取消已经开始的发布
  cancel-in-progress: false

jobs:
  # ── Go 二进制 ───────────────────────────────────────────────────────
  binaries:
    name: Go 二进制
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - name: 读取版本号 (唯一事实源 pyproject.toml)
        run: |
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_ENV"
          echo "GOMOD=github.com/hamr-hub/a-source-gateway/gateway" >> "$GITHUB_ENV"
      - name: 交叉编译 + 打包
        working-directory: gateway
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            bin="dist/a-source-gateway-${os}-${arch}"
            echo "构建 ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X ${GOMOD}/internal/config.Version=${VERSION}" \
              -o "$bin" ./cmd/gateway
          done
      - name: 打包(二进制 + 事实源 + 许可 + 文档)
        run: |
          set -euo pipefail
          mkdir -p dist
          for archive in gateway/dist/a-source-gateway-*; do
            [ -f "$archive" ] || continue
            base="$(basename "$archive")"
            os="${base#a-source-gateway-}"; os="${os%%-*}"
            arch="${base##*-}"
            stage="dist/pkg-${os}-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage/data"
            cp "$archive" "$stage/a-source-gateway"
            cp data/source_inventory.csv data/source_inventory_cn.csv data/endpoints.json data/aliases.json "$stage/data/"
            cp LICENSE NOTICE README.md CHANGELOG.md AGENTS.md "$stage/"
            # 文档站 / 方案文档 / 工具链一起发:下载 tarball 的人不用回仓库就能看文档、
            # 跑 verify_source.py / demo.py。缺了它们,离线用户等于没有说明书。
            cp -r site "$stage/site"
            cp -r docs "$stage/docs"
            cp -r scripts "$stage/scripts"
            tar -czf "dist/${base}.tar.gz" -C "$stage" .
            rm -rf "$stage"
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          # 打包步骤在仓库根执行,产物落在仓库根的 dist/
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Python 包 ───────────────────────────────────────────────────────
  pypi:
    name: 发布到 PyPI
    # PyPI Trusted Publisher 需要先在 PyPI 后台为本仓库登记
    # (PyPI 项目 → Publishing → OIDC)。登记之前该 job 必然失败,
    # 但不应该阻塞 GitHub Release / 镜像 / 二进制。
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI 信任发布(OIDC):不需要长期 token,也不需要写 password secret
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      # 需要在 PyPI 后台给本仓库配置 Trusted Publisher
      # (仓库 hamr-hub/a-source-gateway,workflow release.yml)
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── 容器镜像 ────────────────────────────────────────────────────────
  image:
    name: 推送镜像到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.title=a-source-gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ──────────────────────────────────────────────────
  release:
    name: 创建 GitHub Release
    needs: [binaries, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 取回二进制
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: 生成发布说明
        run: |
          # 从 CHANGELOG.md 提取当前 tag 对应的小节(到下一个同级 ## 标题为止),
          # 不能用 '/^## /,$p' —— 那会把 [未发布] 整段当成发布说明。
          python3 - <<'PY' > RELEASE_NOTES.md
          import os
          import re
          tag = os.environ["GITHUB_REF_NAME"]   # e.g. v1.0.1
          ver = tag.lstrip("v")                 # e.g. 1.0.1
          text = open("CHANGELOG.md", encoding="utf-8").read()
          sections = re.split(r"(?=^## )", text, flags=re.M)
          body = None
          for sec in sections:
              head = sec.splitlines()[0] if sec.splitlines() else ""
              if ver in head:
                  body = sec
                  break
          if body is None:
              body = f"CHANGELOG.md 里没有 {tag} 的小节, 请检查。"
          print(f"## 更新内容({tag})\n\n" + body.strip())
          PY
          cat RELEASE_NOTES.md
      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
