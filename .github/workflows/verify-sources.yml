name: Verify Sources

# 每周一 03:17 UTC 复验所有源。
# 只读主分支:这个工作流不会 commit / push / 改任何文件,
# 发现问题只开 issue —— 上游抖动很常见,自动改清单会把仓库改脏。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-sources
  cancel-in-progress: false

jobs:
  verify:
    name: 复验数据源
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 依赖:scripts/verify_source.py 由 scripts 车道维护。
      # 这里写的是全量复验命令 `python3 scripts/verify_source.py --json`。
      # 该脚本当前(退出码 2 = argparse 用法错误)仍要求一个位置参数,
      # 全量模式还没落地 —— 所以下面带了退路:命令没产出报告时
      # 退化成逐源复验。等 scripts 车道补齐全量模式后,退路自动不再触发。
      - name: 复验所有源
        id: verify
        run: |
          set +e
          python3 scripts/verify_source.py --json > verify-report.json 2> verify-stderr.log
          code=$?
          set -e

          if [ "$code" != "0" ] && ! python3 -c "import json,sys; json.load(open('verify-report.json'))" 2>/dev/null; then
            echo "::notice::scripts/verify_source.py 的全量模式尚未落地(退出码 $code),退化为逐源复验"
            mkdir -p .verify/reports
            python3 -m a_source_gateway.cli build-registry --out .verify/registry.json
            python3 -c "import json;print('\n'.join(s['id'] for s in json.load(open('.verify/registry.json'))['sources']))" > .verify/ids.txt
            failures=0
            while IFS= read -r sid; do
              [ -n "$sid" ] || continue
              # --json 输出的是缩进过的多行 JSON,所以每个源单独存一个文件
              if python3 scripts/verify_source.py "$sid" --json > ".verify/reports/$sid.json" 2>> verify-stderr.log; then
                :
              else
                rc=$?
                failures=$((failures + 1))
                echo "::warning::源 $sid 复验未通过(退出码 $rc)"
              fi
            done < .verify/ids.txt
            python3 - <<'PY'
          import glob
          import json
          import os

          rows = []
          for path in sorted(glob.glob('.verify/reports/*.json')):
              sid = os.path.basename(path)[:-5]
              try:
                  with open(path, encoding='utf-8') as fh:
                      row = json.load(fh)
              except Exception as exc:
                  row = {'source': sid, 'status': 'failed', 'errors': [f'报告无法解析: {exc}']}
              rows.append(row)
          bad = [r for r in rows if r.get('status') != 'verified']
          out = {
              'mode': 'per-source-fallback',
              'total': len(rows),
              'failed': len(bad),
              'results': rows,
          }
          with open('verify-report.json', 'w', encoding='utf-8') as fh:
              json.dump(out, fh, ensure_ascii=False, indent=2)
          print(f"复验完成:{len(rows)} 个源,{len(bad)} 个未通过")
          PY
            code=$failures
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "--- stderr(尾部) ---"
          tail -40 verify-stderr.log || true
          echo "--- 报告 ---"
          head -60 verify-report.json || true

      - name: 上传 JSON 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-sources-report
          path: |
            verify-report.json
            verify-stderr.log
          if-no-files-found: warn
          retention-days: 30

      - name: 失败时开/更新 issue
        if: steps.verify.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runId = context.runId;

            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('verify-report.json', 'utf8'));
            } catch (e) {
              report = { error: `报告解析失败: ${e.message}` };
            }

            // 汇总哪些源没过
            const rows = Array.isArray(report.results) ? report.results : [];
            const bad = rows.filter(r => r.status !== 'verified');
            const lines = bad.slice(0, 50).map(r => {
              const errs = (r.errors || []).join('; ');
              return `- \`${r.source}\` → status=${r.status}${errs ? ' — ' + errs : ''}`;
            });

            const title = '[定时复验] 数据源验证失败';
            const body = [
              `定时复验(${runId})发现 ${bad.length} 个源未通过验证。`,
              '',
              '**这个 issue 由定时任务自动创建/更新,不会自动修改仓库里的源清单**',
              '(上游抖动很常见,自动改清单会把仓库改脏)。请人工确认后再改 `data/`。',
              '',
              '### 未通过的源',
              lines.length ? lines.join('\n') : '- (报告里没有逐源明细,见下面的完整报告)',
              '',
              '### 完整报告',
              '见本次运行的 artifact:`verify-sources-report`',
              '',
              `<details><summary>报告摘要</summary>\n\n\`\`\`json\n${JSON.stringify(
                { total: report.total, failed: report.failed, mode: report.mode, error: report.error },
                null, 2
              )}\n\`\`\`\n\n</details>`,
              '',
              `Run: https://github.com/${owner}/${repo}/actions/runs/${runId}`,
            ].join('\n');

            // 已有同样的 issue 就更新,不要每周刷一个新 issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              core.info(`已更新 issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title, body,
              });
              core.info(`已创建 issue #${created.number}`);
            }
