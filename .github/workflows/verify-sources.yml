name: Verify Sources

# 每周一 03:17 UTC 复验所有源。
# 只读主分支:这个工作流不会 commit / push / 改任何文件,
# 发现问题只开 issue —— 上游抖动很常见,自动改清单会把仓库改脏。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-sources
  cancel-in-progress: false

jobs:
  verify:
    name: 复验数据源
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 全量复验: scripts/verify_source.py --all --json
      # 退出码 = 未通过源数(上限 100);unreachable 不计入失败,
      # 因为上游临时不可达是环境问题,不是清单质量问题。
      - name: 复验所有源
        id: verify
        run: |
          set +e
          python3 scripts/verify_source.py --all --json --timeout 15 > verify-report.json 2> verify-stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "--- stderr(尾部) ---"
          tail -40 verify-stderr.log || true
          echo "--- 报告摘要 ---"
          python3 -c "import json; d=json.load(open('verify-report.json')); print({k: d.get(k) for k in ('mode','total','verified','failed','unreachable')})"

      - name: 上传 JSON 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-sources-report
          path: |
            verify-report.json
            verify-stderr.log
          if-no-files-found: warn
          retention-days: 30

      - name: 失败时开/更新 issue
        if: steps.verify.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runId = context.runId;

            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('verify-report.json', 'utf8'));
            } catch (e) {
              report = { error: `报告解析失败: ${e.message}` };
            }

            // 汇总哪些源没过
            const rows = Array.isArray(report.results) ? report.results : [];
            const bad = rows.filter(r => r.status !== 'verified');
            const lines = bad.slice(0, 50).map(r => {
              const errs = (r.errors || []).join('; ');
              return `- \`${r.source}\` → status=${r.status}${errs ? ' — ' + errs : ''}`;
            });

            const title = '[定时复验] 数据源验证失败';
            const body = [
              `定时复验(${runId})发现 ${bad.length} 个源未通过验证。`,
              '',
              '**这个 issue 由定时任务自动创建/更新,不会自动修改仓库里的源清单**',
              '(上游抖动很常见,自动改清单会把仓库改脏)。请人工确认后再改 `data/`。',
              '',
              '### 未通过的源',
              lines.length ? lines.join('\n') : '- (报告里没有逐源明细,见下面的完整报告)',
              '',
              '### 完整报告',
              '见本次运行的 artifact:`verify-sources-report`',
              '',
              `<details><summary>报告摘要</summary>\n\n\`\`\`json\n${JSON.stringify(
                { total: report.total, failed: report.failed, mode: report.mode, error: report.error },
                null, 2
              )}\n\`\`\`\n\n</details>`,
              '',
              `Run: https://github.com/${owner}/${repo}/actions/runs/${runId}`,
            ].join('\n');

            // 已有同样的 issue 就更新,不要每周刷一个新 issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              core.info(`已更新 issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title, body,
              });
              core.info(`已创建 issue #${created.number}`);
            }
