# ─────────────────────────────────────────────────────────────────────────
# 凭据模板 —— 整份文件不生效,只是把形状写清楚。
#
# ⚠️ 绝不要把真实凭据提交进仓库。
#    凭据只走环境变量,这是本项目的硬规则之一。
#
# 用法(二选一):
#
#   A) kubectl 直接建(推荐,值不进仓库):
#      kubectl -n a-source-gateway create secret generic a-source-gateway-secrets \
#        --from-literal=A_GATEWAY_<某源>_KEY='<value>' \
#        --from-literal=A_GATEWAY_<另一源>_TOKEN='<value>'
#
#   B) 外部密钥管理(ExternalSecrets / Vault / SOPS),由它们在集群里
#      同步出同名 Secret。本文件只是说明期望的 key 命名。
#
# 然后在 deployment.yaml 里放开 secretRef 那段注释。
#
# 期望的 key 命名:一律 A_GATEWAY_<源名大写>_KEY / _TOKEN。
# 具体某个源需要哪个 key,以 data/source_inventory.csv 的「认证方式」列为准
# (无key 的源不需要任何 key)。
# ─────────────────────────────────────────────────────────────────────────
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: a-source-gateway-secrets
#   labels:
#     app.kubernetes.io/name: a-source-gateway
#     app.kubernetes.io/component: gateway
# type: Opaque
# stringData:
#   # 示例:某个需要免费 key 的源
#   # A_GATEWAY_EXAMPLE_SOURCE_API_KEY: "在这里填真实值,不要提交"
#   # 示例:某个需要 token 的源
#   # A_GATEWAY_ANOTHER_SOURCE_TOKEN: "在这里填真实值,不要提交"
